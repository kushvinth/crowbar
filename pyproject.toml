[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crowbar-cli"
dynamic = ["version"]
description = "Retrieve CVEs and index them inside your codebase. One SQLite+FTS5 index, one CLI, one MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kushvinth" }]
keywords = ["security", "cve", "vulnerability", "mcp", "nvd", "kev", "epss", "exploit", "offline", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kushvinth/crowbar"
Repository = "https://github.com/kushvinth/crowbar"
Issues = "https://github.com/kushvinth/crowbar/issues"

[project.scripts]
crowbar-cli = "crowbar.cli:main"
crowbar = "crowbar.cli:main"
crowbar-mcp = "crowbar.mcp:serve"

[tool.hatch.version]
path = "crowbar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["crowbar"]

[tool.hatch.build.targets.sdist]
include = ["crowbar", "mcp", "scripts", "tests", "docs", "README.md", "LICENSE", "AGENTS.md", "Makefile"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# ruff's defaults, pinned so CI and local runs agree
select = ["E4", "E7", "E9", "F"]
