name: links

on:
  push:
    branches: [main]
    paths: ["**/*.md", "website/**"]
  pull_request:
    paths: ["**/*.md", "website/**"]
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: dead links (docs + website)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # shortcut: own-repo and registry pages 404 until the repo is public and 0.1.0 is
      # published; drop those four excludes after the first release
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --accept 200,206,429
            --exclude-path website/node_modules
            --exclude '^https://github\.com/kushvinth/crowbar'
            --exclude '^https://(www\.npmjs\.com|pypi\.org)/(package|project)/crowbar-cli'
            --exclude '^https://repology\.org/'
            --exclude '^https://skills\.sh/'
            './**/*.md' 'website/**/*.html'
          fail: true
