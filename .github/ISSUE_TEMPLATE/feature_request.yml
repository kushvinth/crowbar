name: Feature request
description: A new dataset, command, MCP tool, or capability.
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [new dataset, CLI command, MCP tool, skill / agent integration, packaging / install, performance, other]
    validations: { required: true }
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you answer with crowbar today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: For a new dataset, link the source and its license.
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
