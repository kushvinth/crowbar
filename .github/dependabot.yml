version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: pip
    directory: /packaging/docker
    schedule:
      interval: weekly
    groups:
      docker-build:
        patterns: ["*"]
    commit-message:
      prefix: build
